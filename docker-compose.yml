services:
  yolo:
    # Shares the one image built by the `app` service below. Only `app` declares
    # `build:` so `docker compose up` builds wanyard:latest ONCE — three services
    # building the same tag in parallel races ("image already exists").
    # pull_policy:never — don't race app's build by trying to pull the (unpublished)
    # image from Docker Hub; use the local copy app produces.
    image: wanyard:latest
    pull_policy: never
    container_name: wanyard-yolo
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,json; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/run/yolo/yolo.sock'); s.sendall(b'{\"type\":\"ping\"}\\n'); r=json.loads(s.recv(256)); s.close(); exit(0 if r.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    command: ["-c", "/app/config.yaml", "yolo-serve"]
    environment:
      - YOLO_MODEL_PATH=/app/models/yolo11m.pt
      - VIDEO_DIR=/app/video
      - YOLO_SOCKET=/run/yolo/yolo.sock
      - CLEANUP_DAYS=30
      - WANYARD_LIVE_DETECTOR=1
      - WANYARD_RELAY_HOST=mediamtx
      - WANYARD_RELAY_PATH_SUFFIX=-stamped
      - WANYARD_LIVE_FPS=2.0
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      # - CLEANUP_MAX_GB=200  # uncomment to also cap by total size
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models
      - ./video:/app/video
      - yolo-run:/run/yolo

  app:
    build: .
    image: wanyard:latest
    # build, don't pull: wanyard:latest isn't published, so a plain
    # `docker compose up -d` must build it — otherwise compose retries a denied
    # Docker Hub pull (annoying loop) before falling back to the build.
    pull_policy: build
    container_name: wanyard
    restart: unless-stopped
    # Web port. Defaults to 8091 so a fresh `git clone && docker compose up` is
    # reachable at localhost:8091 (matches config.yaml's port). Override per
    # deploy with WANYARD_WEB_PORT in a local .env (e.g. staging sets 8092) so
    # the prod/staging instances on one host don't collide. App is on the
    # project network so it can reach `mediamtx` by service name.
    ports:
      - "${WANYARD_WEB_PORT:-8091}:${WANYARD_WEB_PORT:-8091}"
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["-c", "/app/config.yaml", "serve"]
    environment:
      - VIDEO_DIR=/app/video
      - YOLO_SOCKET=/run/yolo/yolo.sock
      - WANYARD_RELAY_HOST=mediamtx
      - WANYARD_RELAY_PATH_SUFFIX=-stamped
      - WANYARD_MEDIAMTX_HLS_PORT=${WANYARD_MEDIAMTX_HLS_PORT:-8888}
      # App binds this (overrides config.yaml) so per-deploy ports live only in
      # the .env, never as a local edit to the tracked config.yaml. Matches the
      # published port above.
      - WANYARD_WEB_PORT=${WANYARD_WEB_PORT:-8091}
      # (recorder auto-detects the stamped codec and tags hvc1 only for HEVC)
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./video:/app/video
      - yolo-run:/run/yolo

  mediamtx-conf:
    image: wanyard:latest
    pull_policy: never
    container_name: wanyard-mediamtx-conf
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["-c", "/app/config.yaml", "gen-mediamtx", "--out", "/run/mediamtx/mediamtx.yml"]
    environment:
      - VIDEO_DIR=/app/video
      - WANYARD_MEDIAMTX_HLS_PORT=${WANYARD_MEDIAMTX_HLS_PORT:-8888}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - mediamtx-conf:/run/mediamtx

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    container_name: wanyard-mediamtx
    restart: unless-stopped
    depends_on:
      mediamtx-conf:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["/run/mediamtx/mediamtx.yml"]
    volumes:
      - mediamtx-conf:/run/mediamtx:ro

  stamper:
    image: wanyard:latest   # built by `app` (see note on yolo); no parallel build
    pull_policy: never
    container_name: wanyard-stamper
    restart: unless-stopped
    # The image's default HEALTHCHECK is the app/yolo socket probe — wrong for
    # the stamper. Disable it (a publish-aware check is a later polish).
    healthcheck:
      disable: true
    depends_on:
      mediamtx-conf:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["-c", "/app/config.yaml", "stamp"]
    environment:
      - VIDEO_DIR=/app/video
      - WANYARD_RELAY_HOST=mediamtx
      # Encoder auto-detects NVENC (GPU) and falls back to libx264. Quality-
      # targeted (cq/crf) with a VBV cap above camera native (~1.6M garden /
      # ~0.8M front): re-encoding compressed video needs headroom to match the
      # original's look; the cap just bounds motion peaks for retention.
      # All cameras HEVC for the trial. cq28 (not 25): at cq25 HEVC sat at the
      # 2.5M cap = no storage win vs h264; cq28 lets HEVC's ~30% efficiency drop
      # the bitrate at ~h264-cq25 quality, which is the whole point. Recorder
      # tags the .mp4 hvc1 for browser playback (WANYARD_RECORD_VIDEO_TAG).
      - WANYARD_STAMP_ENCODER=auto
      - WANYARD_STAMP_CQ=28
      - WANYARD_STAMP_MAXRATE=2.5M
      - WANYARD_STAMP_BUFSIZE=5M
      # realtime-live experiment: 1s keyframe interval -> 1s HLS segments ->
      # lower live latency (see liveSyncDurationCount + hls_time=1).
      - WANYARD_STAMP_GOP_SECONDS=1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data

volumes:
  yolo-run:
  mediamtx-conf:
