services:
  yolo:
    build: .
    image: wanyard:latest
    container_name: wanyard-yolo
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,json; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/run/yolo/yolo.sock'); s.sendall(b'{\"type\":\"ping\"}\\n'); r=json.loads(s.recv(256)); s.close(); exit(0 if r.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    command: ["-c", "/app/config.yaml", "yolo-serve"]
    environment:
      - YOLO_MODEL_PATH=/app/models/yolo11m.pt
      - VIDEO_DIR=/app/video
      - YOLO_SOCKET=/run/yolo/yolo.sock
      - CLEANUP_DAYS=30
      - WANYARD_LIVE_DETECTOR=1
      - WANYARD_RELAY_HOST=mediamtx
      - WANYARD_RELAY_PATH_SUFFIX=-stamped
      - WANYARD_LIVE_FPS=2.0
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      # - CLEANUP_MAX_GB=200  # uncomment to also cap by total size
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models
      - ./video:/app/video
      - yolo-run:/run/yolo

  app:
    build: .
    image: wanyard:latest
    container_name: wanyard
    restart: unless-stopped
    # web port is published per-env in docker-compose.override.yml
    # (staging 8092, prod 8091); app must be on the project network so it
    # can reach `mediamtx` by service name
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["-c", "/app/config.yaml", "serve"]
    environment:
      - VIDEO_DIR=/app/video
      - YOLO_SOCKET=/run/yolo/yolo.sock
      - WANYARD_RELAY_HOST=mediamtx
      - WANYARD_RELAY_PATH_SUFFIX=-stamped
      # Stamper emits HEVC; tag the .mp4 archive hvc1 so Chrome/Safari play it.
      - WANYARD_RECORD_VIDEO_TAG=hvc1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./video:/app/video
      - yolo-run:/run/yolo

  mediamtx-conf:
    image: wanyard:latest
    container_name: wanyard-mediamtx-conf
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["-c", "/app/config.yaml", "gen-mediamtx", "--out", "/run/mediamtx/mediamtx.yml"]
    environment:
      - VIDEO_DIR=/app/video
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - mediamtx-conf:/run/mediamtx

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    container_name: wanyard-mediamtx
    restart: unless-stopped
    depends_on:
      mediamtx-conf:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["/run/mediamtx/mediamtx.yml"]
    volumes:
      - mediamtx-conf:/run/mediamtx:ro

  stamper:
    build: .
    image: wanyard:latest
    container_name: wanyard-stamper
    restart: unless-stopped
    # The image's default HEALTHCHECK is the app/yolo socket probe — wrong for
    # the stamper. Disable it (a publish-aware check is a later polish).
    healthcheck:
      disable: true
    depends_on:
      mediamtx-conf:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["-c", "/app/config.yaml", "stamp"]
    environment:
      - VIDEO_DIR=/app/video
      - WANYARD_RELAY_HOST=mediamtx
      # Encoder auto-detects NVENC (GPU) and falls back to libx264. Quality-
      # targeted (cq/crf) with a VBV cap above camera native (~1.6M garden /
      # ~0.8M front): re-encoding compressed video needs headroom to match the
      # original's look; the cap just bounds motion peaks for retention.
      # All cameras HEVC for the trial. cq28 (not 25): at cq25 HEVC sat at the
      # 2.5M cap = no storage win vs h264; cq28 lets HEVC's ~30% efficiency drop
      # the bitrate at ~h264-cq25 quality, which is the whole point. Recorder
      # tags the .mp4 hvc1 for browser playback (WANYARD_RECORD_VIDEO_TAG).
      - WANYARD_STAMP_ENCODER=hevc_nvenc
      - WANYARD_STAMP_CQ=28
      - WANYARD_STAMP_MAXRATE=2.5M
      - WANYARD_STAMP_BUFSIZE=5M
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data

volumes:
  yolo-run:
  mediamtx-conf:
