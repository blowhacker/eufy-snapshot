services:
  yolo:
    # Shares the one image built by the `app` service below. Only `app` declares
    # `build:` so `docker compose up` builds wanyard:latest ONCE — three services
    # building the same tag in parallel races ("image already exists").
    # pull_policy:never — don't race app's build by trying to pull the (unpublished)
    # image from Docker Hub; use the local copy app produces.
    image: wanyard:latest
    pull_policy: never
    container_name: wanyard-yolo
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,json; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/run/yolo/yolo.sock'); s.sendall(b'{\"type\":\"ping\"}\\n'); r=json.loads(s.recv(256)); s.close(); exit(0 if r.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    command: ["-c", "/app/config.yaml", "yolo-serve"]
    environment:
      - YOLO_MODEL_PATH=/app/models/yolo11m.pt
      - VIDEO_DIR=/app/video
      - YOLO_SOCKET=/run/yolo/yolo.sock
      - CLEANUP_DAYS=30
      - WANYARD_LIVE_DETECTOR=1
      - WANYARD_RELAY_HOST=mediamtx
      - WANYARD_RELAY_PATH_SUFFIX=-stamped
      - WANYARD_LIVE_FPS=2.0
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      # - CLEANUP_MAX_GB=200  # uncomment to also cap by total size
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/app/models
      - ./video:/app/video
      - yolo-run:/run/yolo

  app:
    build: .
    image: wanyard:latest
    # build, don't pull: wanyard:latest isn't published, so a plain
    # `docker compose up -d` must build it — otherwise compose retries a denied
    # Docker Hub pull (annoying loop) before falling back to the build.
    pull_policy: build
    container_name: wanyard
    restart: unless-stopped
    # Web port. Defaults to 8091 so a fresh `git clone && docker compose up` is
    # reachable at localhost:8091 (matches config.yaml's port). Override per
    # deploy with WANYARD_WEB_PORT in a local .env (e.g. staging sets 8092) so
    # the prod/staging instances on one host don't collide. App is on the
    # project network so it can reach `mediamtx` by service name.
    ports:
      - "${WANYARD_WEB_PORT:-8091}:${WANYARD_WEB_PORT:-8091}"
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["-c", "/app/config.yaml", "serve"]
    environment:
      - VIDEO_DIR=/app/video
      - YOLO_SOCKET=/run/yolo/yolo.sock
      - WANYARD_RELAY_HOST=mediamtx
      - WANYARD_RELAY_PATH_SUFFIX=-stamped
      - WANYARD_MEDIAMTX_HLS_PORT=${WANYARD_MEDIAMTX_HLS_PORT:-8888}
      - WANYARD_MEDIAMTX_METRICS_URL=http://mediamtx:9998/metrics
      - WANYARD_MEDIA_HEALTH_DB=/app/data/media-health.db
      - WANYARD_MEDIA_HEALTH_INTERVAL=15
      # App binds this (overrides config.yaml) so per-deploy ports live only in
      # the .env, never as a local edit to the tracked config.yaml. Matches the
      # published port above.
      - WANYARD_WEB_PORT=${WANYARD_WEB_PORT:-8091}
      # Override the WebRTC ICE host the wall advertises. Default (empty) = the
      # WHEP proxy uses the address the browser reached us on — works out of the
      # box. Set only for topologies where that host isn't reachable for ICE.
      - WANYARD_WEBRTC_ADDITIONAL_HOSTS=${WANYARD_WEBRTC_ADDITIONAL_HOSTS:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./video:/app/video
      - yolo-run:/run/yolo

  mediamtx-conf:
    image: wanyard:latest
    pull_policy: never
    container_name: wanyard-mediamtx-conf
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["-c", "/app/config.yaml", "gen-mediamtx", "--out", "/run/mediamtx/mediamtx.yml"]
    environment:
      - VIDEO_DIR=/app/video
      - WANYARD_MEDIAMTX_HLS_PORT=${WANYARD_MEDIAMTX_HLS_PORT:-8888}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - mediamtx-conf:/run/mediamtx

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    container_name: wanyard-mediamtx
    restart: unless-stopped
    depends_on:
      mediamtx-conf:
        condition: service_completed_successfully
      go2rtc:
        condition: service_started   # mediamtx sources from go2rtc now
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["/run/mediamtx/mediamtx.yml"]
    volumes:
      - mediamtx-conf:/run/mediamtx:ro

  stamper:
    image: wanyard:latest   # built by `app` (see note on yolo); no parallel build
    pull_policy: never
    container_name: wanyard-stamper
    restart: unless-stopped
    # The image's default HEALTHCHECK is the app/yolo socket probe — wrong for
    # the stamper. Disable it (a publish-aware check is a later polish).
    healthcheck:
      disable: true
    depends_on:
      mediamtx-conf:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["-c", "/app/config.yaml", "stamp"]
    environment:
      - VIDEO_DIR=/app/video
      - WANYARD_RELAY_HOST=mediamtx
      - WANYARD_MEDIA_HEALTH_DB=/app/data/media-health.db
      # Stamping is SEI codec-copy by default (zero re-encode; archive = the
      # camera's own bits). These knobs tune the h264 re-encode FALLBACK only
      # (non-h264 camera input): NVENC when available, else libx264; quality-
      # targeted (cq/crf) with a VBV cap bounding motion peaks for retention.
      - WANYARD_STAMP_ENCODER=auto
      - WANYARD_STAMP_CQ=28
      - WANYARD_STAMP_MAXRATE=2.5M
      - WANYARD_STAMP_BUFSIZE=5M
      # realtime-live experiment: 1s keyframe interval -> 1s HLS segments ->
      # lower live latency (see liveSyncDurationCount + hls_time=1).
      - WANYARD_STAMP_GOP_SECONDS=1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data

  # go2rtc is the camera ingest + the wall's INSTANT WebRTC. It reads each camera
  # directly, serves RTSP to mediamtx (recording/BITC) and WebRTC to the wall.
  # WebRTC candidates use STUN auto-discovery, so a plain `docker compose up`
  # works with no hostname config. Config generated from the source DB at boot.
  go2rtc-conf:
    image: wanyard:latest
    pull_policy: never
    container_name: wanyard-go2rtc-conf
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    command: ["-c", "/app/config.yaml", "gen-go2rtc", "--out", "/run/go2rtc/go2rtc.yaml"]
    environment:
      # WebRTC media port. Default 8555 works for a single install; override only
      # to avoid a collision when several stacks share a host.
      - WANYARD_GO2RTC_WEBRTC_PORT=${WANYARD_GO2RTC_WEBRTC_PORT:-8555}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - go2rtc-conf:/run/go2rtc

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: wanyard-go2rtc
    restart: unless-stopped
    depends_on:
      go2rtc-conf:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
    # WebRTC media (ICE) — direct browser<->go2rtc. The HTTP API (:1984, WHEP)
    # stays internal (proxied by the app). UDP preferred; TCP same port fallback.
    ports:
      - "${WANYARD_GO2RTC_WEBRTC_PORT:-8555}:${WANYARD_GO2RTC_WEBRTC_PORT:-8555}/udp"
      - "${WANYARD_GO2RTC_WEBRTC_PORT:-8555}:${WANYARD_GO2RTC_WEBRTC_PORT:-8555}/tcp"
    # The image auto-loads /config/go2rtc.yaml (no command needed). go2rtc-conf
    # writes the boot config into this shared volume; keep it writable so the
    # internal API can persist cameras added at runtime.
    volumes:
      - go2rtc-conf:/config

volumes:
  yolo-run:
  mediamtx-conf:
  go2rtc-conf:
