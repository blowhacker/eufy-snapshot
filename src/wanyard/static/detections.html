<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Detections — Wanyard</title>
    <meta name="theme-color" content="#06080b">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/detections.css?v=15">
  </head>
  <body>
    <div class="dw-sticky">
      <header class="dw-head">
        <div class="dw-brand">
          <a class="dw-logo" href="/?view=wall" title="Live wall" aria-label="Open live camera wall">
            <img src="/assets/favicon.svg" alt="">
          </a>
          <h1 class="dw-title">Detections</h1>
        </div>
        <div id="dwSummary" class="dw-summary" aria-live="polite">Loading</div>
        <nav class="dw-actions" aria-label="Detection controls">
          <div class="dw-view-switch" role="group" aria-label="Detection view">
            <button id="dwGridView" class="dw-view-option active" type="button" aria-pressed="true">Grid</button>
            <button id="dwFeedView" class="dw-view-option" type="button" aria-pressed="false">
              <svg width="15" height="15" viewBox="0 0 17 17" fill="none" aria-hidden="true"><rect x="3.5" y="2" width="10" height="5.2" rx="1" stroke="currentColor" stroke-width="1.25"/><rect x="3.5" y="9.8" width="10" height="5.2" rx="1" stroke="currentColor" stroke-width="1.25"/></svg>
              <span>Feed</span>
            </button>
          </div>
          <button id="dwRefresh" class="dw-icon" type="button" title="Refresh detections" aria-label="Refresh detections">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M12.5 5.2A5 5 0 1 0 13 9" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><path d="M10.1 2.8h2.8v2.8" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <a class="dw-icon" href="/settings" title="Settings" aria-label="Settings">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/><path d="M8 2v1.5M8 12.5V14M2 8h1.5M12.5 8H14M3.8 3.8l1 1M11.2 11.2l1 1M3.8 12.2l1-1M11.2 4.8l1-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </a>
        </nav>
      </header>

      <div class="dw-filters">
        <section class="dw-filter" aria-labelledby="dwCameraFilterTitle">
          <div id="dwCameraFilterTitle" class="dw-filter-label">Cameras</div>
          <div id="dwCameras" class="dw-tags" role="group" aria-label="Filter by camera"></div>
        </section>
        <section id="dwAreasFilter" class="dw-filter" aria-labelledby="dwAreaFilterTitle" hidden>
          <div id="dwAreaFilterTitle" class="dw-filter-label">Areas</div>
          <div id="dwAreas" class="dw-tags" role="group" aria-label="Filter by detection area"></div>
        </section>
        <section class="dw-filter" aria-labelledby="dwFilterTitle">
          <div id="dwFilterTitle" class="dw-filter-label">Objects</div>
          <div id="dwTags" class="dw-tags" role="group" aria-label="Filter by detected object"></div>
        </section>
      </div>
    </div>

    <main id="dwMain" class="dw-main">
      <div class="dw-skeleton" aria-label="Loading detections">
        <div class="dw-skeleton-head"></div>
        <div class="dw-skeleton-grid">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
    </main>

    <template id="dwEmptyTemplate">
      <div class="dw-empty">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7.5h11.5a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.35"/><path d="m17.5 10 4-2.2v8.4l-4-2.2V10Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="m8.4 10.2 3.2 3.2M11.6 10.2l-3.2 3.2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
        <strong>No detections</strong>
        <span>Try another object tag or check back after the detector has seen some activity.</span>
      </div>
    </template>

    <script src="/detection-preview-track.js?v=4"></script>
    <script src="/detections.js?v=29"></script>
  </body>
</html>
